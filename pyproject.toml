[project]
name = "grafia-concisa"
version = "0.2.0"
description = "grafia concisă — Romanian orthography compressing ie/ia/ea/oa diphthongs"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
]

[tool.uv]
required-version = ">=0.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grafia_concisa"]
