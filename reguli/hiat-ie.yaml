# Neologismele în care ie e hiat (două silabe) după p, b, f, v, m, c, g, ch, gh: igienă, pieton.
# Acolo ie e altfel diftong (fier, piept). Tabelul acesta e consultat de pasul „ie în
# neologisme” din pasi.yaml, care spune unde se aplică.
#
# Fiecare intrare are:
# - tipar: unul sau mai multe tipare, fiecare cu perechea ie; ^ e începutul cuvântului, $ sfârșitul;
# - ante, non_ante: ce stă (sau ce nu stă) chiar înaintea tiparului; post, non_post: ce urmează
#   (sau ce nu urmează) chiar după el; ^ în ante: tiparul începe cuvântul; $ în post: îl termină;
#   o majusculă e o clasă de litere: C o consoană, V o vocală, și cele din clase.yaml (L, P);
# - exemple: cuvinte pe care le decide intrarea;
# - contraexemple: cuvinte cu literele unui tipar, pe care contextele sau ^, $ le exclud
#   (obligatorii cu non_ante și non_post).
# Prima intrare care se aplică decide. cargo test verifică fiecare exemplu și contraexemplu.

- tipar: [gien, pieton, cviet, societ, soviet, vien]
  exemple: [igienă, pieton, cvietism, societar, sovietism, sovietic, vienez]

# nu miel, mielușor
- tipar: [miel]
  post: [o, in, it, ie]
  exemple: [mielom, demielinizare, mielită, poliomielită, amielie]
  contraexemple: [miel, mielușor]

# -ietor, -ietoare
- tipar: [ietor, ietoar]
  exemple: [așchietor, așchietoare]

# nu zbiera, nici biert
- tipar: [bier]
  non_ante: [^, z, s]
  exemple: [bărbierit, corăbierie]
  contraexemple: [zbiera, zbieret, sbiera, biert]
