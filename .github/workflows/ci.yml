name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # the loading checks of the rule files of reguli/: in Romanian, each also as an annotation on
      # its line of the pull request (the core's build would stop on them, without the annotations)
      - run: cargo run -p grafia-reguli --locked
      # web/grafia.dat, from the export of dexonline that dexonline.lock pins: the WASM
      # tests and the web app read it, and it is the one deployed
      - run: cargo xtask data
      # it covers grafia-wasm's code too; the WASM clippy, which adds only tests/node.rs, runs locally
      # (the test-gauntlet skill), and the WASM tests below compile that file
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      # wasm-bindgen-test-runner, of the version of wasm-bindgen in Cargo.lock
      - id: wasm-bindgen
        run: echo "version=$(cargo pkgid wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: cargo test -p grafia-wasm --target wasm32-unknown-unknown --locked
      - run: cargo xtask web
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  # On a pull request: the words whose spelling it changes, against its base, in Romanian,
  # in the job's summary and in one comment on the pull request, replaced on each push
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit, for its snapshot
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask diff ${{ github.event.pull_request.base.sha }} --max 50
      - run: cat data/snapshot/diff.md >> "$GITHUB_STEP_SUMMARY"
      # a pull request from a fork gets the summary only: its token can't write
      - if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cargo xtask diff -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = fs.readFileSync('data/snapshot/diff.md', 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n… (trunchiat)\n';
            body = `${marker}\n${body}\n[Rularea](${run})\n`;
            const params = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const old = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...params, body });

  # Publishes web/dist on GitHub Pages, after every test passed on main
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
