# The core runs in WASM and inside an iOS keyboard extension: no files, network, processes or environment.
# The reading and writing of files belongs to the pipeline crate and to examples (which allow these lints).

disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "the core does no file access" },
    { path = "std::fs::copy", reason = "the core does no file access" },
    { path = "std::fs::create_dir", reason = "the core does no file access" },
    { path = "std::fs::create_dir_all", reason = "the core does no file access" },
    { path = "std::fs::hard_link", reason = "the core does no file access" },
    { path = "std::fs::metadata", reason = "the core does no file access" },
    { path = "std::fs::read", reason = "the core does no file access" },
    { path = "std::fs::read_dir", reason = "the core does no file access" },
    { path = "std::fs::read_link", reason = "the core does no file access" },
    { path = "std::fs::read_to_string", reason = "the core does no file access" },
    { path = "std::fs::remove_dir", reason = "the core does no file access" },
    { path = "std::fs::remove_dir_all", reason = "the core does no file access" },
    { path = "std::fs::remove_file", reason = "the core does no file access" },
    { path = "std::fs::rename", reason = "the core does no file access" },
    { path = "std::fs::set_permissions", reason = "the core does no file access" },
    { path = "std::fs::symlink_metadata", reason = "the core does no file access" },
    { path = "std::fs::write", reason = "the core does no file access" },
    { path = "std::fs::exists", reason = "the core does no file access" },
    { path = "std::env::args", reason = "the core does not read the environment" },
    { path = "std::env::args_os", reason = "the core does not read the environment" },
    { path = "std::env::current_dir", reason = "the core does not read the environment" },
    { path = "std::env::current_exe", reason = "the core does not read the environment" },
    { path = "std::env::set_current_dir", reason = "the core does not read the environment" },
    { path = "std::env::set_var", reason = "the core does not read the environment" },
    { path = "std::env::remove_var", reason = "the core does not read the environment" },
    { path = "std::env::var", reason = "the core does not read the environment" },
    { path = "std::env::var_os", reason = "the core does not read the environment" },
    { path = "std::env::vars", reason = "the core does not read the environment" },
    { path = "std::env::vars_os", reason = "the core does not read the environment" },
    { path = "std::env::temp_dir", reason = "the core does not read the environment" },
    { path = "std::env::home_dir", reason = "the core does not read the environment" },
    { path = "std::process::exit", reason = "the core does not control the process" },
    { path = "std::process::abort", reason = "the core does not control the process" },
]

disallowed-types = [
    { path = "std::fs::File", reason = "the core does no file access" },
    { path = "std::fs::OpenOptions", reason = "the core does no file access" },
    { path = "std::fs::DirBuilder", reason = "the core does no file access" },
    { path = "std::fs::ReadDir", reason = "the core does no file access" },
    { path = "std::fs::DirEntry", reason = "the core does no file access" },
    { path = "std::net::TcpStream", reason = "the core does no network access" },
    { path = "std::net::TcpListener", reason = "the core does no network access" },
    { path = "std::net::UdpSocket", reason = "the core does no network access" },
    { path = "std::process::Command", reason = "the core does no process spawning" },
    { path = "std::process::Child", reason = "the core does no process spawning" },
]
